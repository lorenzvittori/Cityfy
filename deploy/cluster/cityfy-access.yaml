# Namespace of CityFy and the identity GitHub Actions deploys with.
#   - the ServiceAccount "cityfy-deployer" can manage the usual resources ONLY in namespace "cityfy":
#     no cluster rights, no RBAC changes, no other namespaces;
#   - its long-lived token is in the Secret "cityfy-deployer-token": the kubeconfig built from it
#     goes into the GitHub secret CITYFY_KUBECONFIG (see DEPLOY.md). Delete the Secret to revoke it.
apiVersion: v1
kind: Namespace
metadata:
  name: cityfy
  labels:
    pacoaccess.com/postgres-client: "true" # may connect to the shared PostgreSQL (data/postgres)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cityfy-deployer
  namespace: cityfy
---
apiVersion: v1
kind: Secret
metadata:
  name: cityfy-deployer-token
  namespace: cityfy
  annotations:
    kubernetes.io/service-account.name: cityfy-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: cityfy
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cityfy-deployer
  namespace: cityfy
subjects:
  - kind: ServiceAccount
    name: cityfy-deployer
    namespace: cityfy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
