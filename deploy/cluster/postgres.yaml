# Shared PostgreSQL for all the applications of the cluster.
#   - namespace "data", address postgres.data.svc.cluster.local:5432 (never exposed outside the cluster);
#   - image pinned to the major version (17): minor updates only, a new major needs a dump/restore;
#   - data on a local-path-retain volume (survives the deletion of the PVC);
#   - the superuser "postgres" password is in the Secret "postgres-superuser", created BY HAND (never in git):
#       kubectl -n data create secret generic postgres-superuser --from-literal=password='<strong password>'
#   - every application gets its own role and database (owner of it), never "postgres" (see DEPLOY.md);
#   - only namespaces labelled pacoaccess.com/postgres-client=true can connect (NetworkPolicy).
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  labels: { app: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-superuser, key: password }
            # Subfolder: the root of the volume is not an empty folder for initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Europe/Rome
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm # the default 64 MB of /dev/shm is too small for parallel queries
              mountPath: /dev/shm
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          startupProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path-retain
        resources:
          requests: { storage: 30Gi }
---
# Only the pods of namespaces with the label pacoaccess.com/postgres-client=true reach port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: data
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              pacoaccess.com/postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432
