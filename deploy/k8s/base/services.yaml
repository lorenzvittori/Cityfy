# The 7 .NET services (port 8080, user 1654 of the .NET images). Only "api" is reached from outside,
# through the Ingress (ingress.yaml); the others stay inside the cluster.
# Connections follow the WithReference of CityFy.AppHost:
#   - Mongo + RabbitMQ: every service except RetrieveMusicBrainz;
#   - PostgreSQL "musicbrainz" (shared, data/postgres): RetrieveMusicBrainz and Api (admin panel).
# Strategy Recreate: services with a ReadWriteOnce volume or that must run as a single instance
# (Api: live events; background jobs and pollers).
#
# Probes: /alive (process up) for startup and liveness, /health for readiness.

# --- Api (gateway) ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1 # must stay 1: with more instances every live event would reach only one
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, fsGroup: 1654 }
      containers:
        - name: api
          image: cityfy-api
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: cityfy-config } }]
          env:
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: mongo-password } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: rabbitmq-password } }
            - name: PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: cityfy-config, key: PUBLIC_URL } }
            - { name: ConnectionStrings__cityfy, value: "mongodb://cityfy:$(MONGO_PASSWORD)@mongo:27017/cityfy?authSource=admin" }
            - { name: ConnectionStrings__broker, value: "amqp://cityfy:$(RABBITMQ_PASSWORD)@broker:5672" }
            - name: ConnectionStrings__musicbrainz
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: musicbrainz-connection } }
            - { name: Frontend__BaseUrl, value: "$(PUBLIC_URL)" }
            - { name: DataProtection__KeysPath, value: /data/keys } # session cookie keys: survive deploys
            # Traefik runs in the pod network: its X-Forwarded-For gives the real client address,
            # which the rate limits count on (see deploy/cluster/traefik-config.yaml)
            - { name: Proxy__KnownNetworks__0, value: 10.42.0.0/16 }
            - { name: services__Catalog__http__0, value: "http://catalog:8080" }
            - { name: services__CityGenerator__http__0, value: "http://city-generator:8080" }
            - { name: services__Orchestrator__http__0, value: "http://orchestrator:8080" }
            - { name: services__RetrieveDumpSpotify__http__0, value: "http://retrieve-dump-spotify:8080" }
            - { name: services__RetrieveLastFm__http__0, value: "http://retrieve-lastfm:8080" }
            - { name: services__RetrieveMusicBrainz__http__0, value: "http://retrieve-musicbrainz:8080" }
          volumeMounts: [{ name: keys, mountPath: /data/keys }]
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          startupProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 20, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
      volumes:
        - name: keys
          persistentVolumeClaim: { claimName: api-keys }

