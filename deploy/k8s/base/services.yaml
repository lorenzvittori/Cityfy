# --- RetrieveLastFm ----------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: retrieve-lastfm
spec:
  selector: { app: retrieve-lastfm }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieve-lastfm
spec:
  replicas: 1 # single poller and single Last.fm request gate
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: retrieve-lastfm }
  template:
    metadata:
      labels: { app: retrieve-lastfm }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, fsGroup: 1654 }
      containers:
        - name: retrieve-lastfm
          image: cityfy-retrieve-lastfm
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: cityfy-config } }]
          env:
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: mongo-password } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: rabbitmq-password } }
            - name: PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: cityfy-config, key: PUBLIC_URL } }
            - { name: ConnectionStrings__cityfy, value: "mongodb://cityfy:$(MONGO_PASSWORD)@mongo:27017/cityfy?authSource=admin" }
            - { name: ConnectionStrings__broker, value: "amqp://cityfy:$(RABBITMQ_PASSWORD)@broker:5672" }
            - name: LastFm__ApiKey
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: lastfm-api-key } }
            - name: LastFm__SharedSecret
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: lastfm-shared-secret } }
            - { name: LastFm__CallbackUrl, value: "$(PUBLIC_URL)/api/v1/auth/lastfm/callback" }
            - { name: DataProtection__KeysPath, value: /data/keys } # encrypts the stored session keys: must never be lost
          volumeMounts: [{ name: keys, mountPath: /data/keys }]
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          startupProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 20, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
      volumes:
        - name: keys
          persistentVolumeClaim: { claimName: lastfm-keys }

# --- RetrieveMusicBrainz -----------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: retrieve-musicbrainz
spec:
  selector: { app: retrieve-musicbrainz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieve-musicbrainz
spec:
  replicas: 1 # the import job runs in this process
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: retrieve-musicbrainz }
  template:
    metadata:
      labels: { app: retrieve-musicbrainz }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, fsGroup: 1654 }
      containers:
        - name: retrieve-musicbrainz
          image: cityfy-retrieve-musicbrainz
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: cityfy-config } }]
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: rabbitmq-password } }
            - { name: ConnectionStrings__broker, value: "amqp://cityfy:$(RABBITMQ_PASSWORD)@broker:5672" }
            - name: ConnectionStrings__musicbrainz
              valueFrom: { secretKeyRef: { name: cityfy-secrets, key: musicbrainz-connection } }
            - { name: DumpStorage__RootPath, value: /data/mb-dumps } # the dump archives are several GB
          volumeMounts: [{ name: mb-dumps, mountPath: /data/mb-dumps }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1536Mi }
          # migrations run at startup (Database.Migrate): the first start can be slow
          startupProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 5, failureThreshold: 120 }
          livenessProbe: { httpGet: { path: /alive, port: http }, periodSeconds: 20, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
      volumes:
        - name: mb-dumps
          persistentVolumeClaim: { claimName: mb-dumps }
