# Public entry point: https://cityfy.app.pacoaccess.com (Cloudflare record A "cityfy.app", DNS only).
#   /api/* -> Api (the only backend reachable from outside), everything else -> web (Angular).
#   Certificate: Let's Encrypt production through cert-manager (ClusterIssuer letsencrypt-prod, HTTP-01).
# Traefik neither buffers nor compresses responses by default: the live events of /api/v1/live
# (Server-Sent Events) reach the browser one by one. Do not add a compress middleware to this route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cityfy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: cityfy-https-redirect@kubernetescrd,cityfy-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [cityfy.app.pacoaccess.com]
      secretName: cityfy-tls
  rules:
    - host: cityfy.app.pacoaccess.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
