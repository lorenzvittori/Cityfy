name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TAG: ${{ github.sha }}
  KUBECTL_VERSION: v1.37.2

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Registry name
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: .NET services
        working-directory: CityFy
        run: |
          set -euo pipefail

          for pair in \
            api:CityFy.Api \
            catalog:CityFy.Catalog \
            city-generator:CityFy.CityGenerator \
            orchestrator:CityFy.Orchestrator \
            retrieve-dump-spotify:CityFy.Retrieve.Dump.Spotify \
            retrieve-lastfm:CityFy.Retrieve.LastFm
          do
            name="${pair%%:*}"
            project="${pair#*:}"

            dotnet publish "$project/$project.csproj" \
              -c Release \
              -r linux-x64 \
              -t:PublishContainer \
              -p:ContainerRegistry=ghcr.io \
              -p:ContainerRepository="$OWNER/cityfy-$name" \
              -p:ContainerImageTag="$TAG"
          done

      - name: RetrieveMusicBrainz
        run: |
          set -euo pipefail

          dotnet publish \
            CityFy/CityFy.Retrieve.MusicBrainz/CityFy.Retrieve.MusicBrainz.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o publish/musicbrainz

          docker build --platform linux/amd64 \
            -f deploy/musicbrainz.Dockerfile \
            -t "$REGISTRY/cityfy-retrieve-musicbrainz:$TAG" \
            publish/musicbrainz

          docker push "$REGISTRY/cityfy-retrieve-musicbrainz:$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cityfy-web/package-lock.json

      - name: Frontend
        run: |
          set -euo pipefail

          cd cityfy-web
          npm ci
          npx ng build
          cd ..

          docker build --platform linux/amd64 \
            -f deploy/web.Dockerfile \
            -t "$REGISTRY/cityfy-web:$TAG" \
            .

          docker push "$REGISTRY/cityfy-web:$TAG"

  deploy:
    needs: images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production

    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_NAME: ${{ vars.DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the configuration
        shell: bash
        env:
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          SSH_KEY: ${{ vars.DEPLOY_SSH_KEY }}
          KUBECONFIG_DATA: ${{ vars.CITYFY_KUBECONFIG }}
          GHCR_PULL_TOKEN: ${{ vars.GHCR_PULL_TOKEN }}
          MONGO_PASSWORD: ${{ vars.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ vars.RABBITMQ_PASSWORD }}
          MUSICBRAINZ_SQL_CONNECTION: ${{ vars.MUSICBRAINZ_SQL_CONNECTION }}
          LASTFM_API_KEY: ${{ vars.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ vars.LASTFM_SHARED_SECRET }}
        run: |
          set -euo pipefail

          missing=0

          for v in \
            HOST USER_NAME KNOWN_HOSTS GHCR_PULL_USER SSH_KEY \
            KUBECONFIG_DATA GHCR_PULL_TOKEN MONGO_PASSWORD \
            RABBITMQ_PASSWORD MUSICBRAINZ_SQL_CONNECTION \
            LASTFM_API_KEY LASTFM_SHARED_SECRET
          do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              missing=1
            fi
          done

          exit "$missing"

      - name: Install kubectl
        run: |
          set -euo pipefail

          curl -fsSLo "$RUNNER_TEMP/kubectl" \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"

          install -m 755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl

          kubectl version --client

      - name: SSH key and known host
        shell: bash
        env:
          SSH_KEY: ${{ vars.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Normalize Windows CRLF line endings before validation.
          SSH_KEY="${SSH_KEY//$'\r'/}"
          KNOWN_HOSTS="${KNOWN_HOSTS//$'\r'/}"

          install -m 700 -d ~/.ssh

          echo "SSH key diagnostics"
          echo "Length: ${#SSH_KEY}"
          echo "Line count: $(printf '%s' "$SSH_KEY" | awk 'END {print NR}')"

          if [[ "$SSH_KEY" == *'\n'* ]]; then
            echo "::error::Literal backslash-n detected in SSH key"
            exit 1
          else
            echo "FORMAT: no literal backslash-n"
          fi

          if [[ "$SSH_KEY" == *$'\r'* ]]; then
            echo "::error::CR characters still detected"
            exit 1
          else
            echo "FORMAT: no CR characters"
          fi

          if [[ "$SSH_KEY" == "-----BEGIN OPENSSH PRIVATE KEY-----"* ]]; then
            echo "HEADER: correct"
          else
            echo "::error::HEADER: incorrect"
            exit 1
          fi

          if [[ "$SSH_KEY" == *"-----END OPENSSH PRIVATE KEY-----" ]]; then
            echo "FOOTER: correct"
          else
            echo "::error::FOOTER: incorrect"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

          echo "Checking SSH private key..."

          if ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "SSH private key is valid"
          else
            echo "::error::SSH private key is invalid or incorrectly formatted"
            exit 1
          fi

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts is empty"
            exit 1
          fi

          echo "SSH configuration prepared"

      - name: Tunnel to Kubernetes API
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -M \
            -S "$RUNNER_TEMP/tunnel.sock" \
            -f -N \
            -L 6443:127.0.0.1:6443 \
            "$USER_NAME@$HOST"

          echo "SSH tunnel established"

      - name: Kubeconfig
        shell: bash
        env:
          KUBECONFIG_DATA: ${{ vars.CITYFY_KUBECONFIG }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.kube

          printf '%s\n' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

          kubectl -n cityfy auth can-i create deployments

      - name: Secrets
        shell: bash
        env:
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ vars.GHCR_PULL_TOKEN }}
          MONGO_PASSWORD: ${{ vars.MONGO_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ vars.RABBITMQ_PASSWORD }}
          MUSICBRAINZ_SQL_CONNECTION: ${{ vars.MUSICBRAINZ_SQL_CONNECTION }}
          LASTFM_API_KEY: ${{ vars.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ vars.LASTFM_SHARED_SECRET }}
        run: |
          set -euo pipefail

          kubectl -n cityfy create secret generic cityfy-secrets \
            --from-literal=mongo-password="$MONGO_PASSWORD" \
            --from-literal=rabbitmq-password="$RABBITMQ_PASSWORD" \
            --from-literal=musicbrainz-connection="$MUSICBRAINZ_SQL_CONNECTION" \
            --from-literal=lastfm-api-key="$LASTFM_API_KEY" \
            --from-literal=lastfm-shared-secret="$LASTFM_SHARED_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n cityfy create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USER" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Manifests
        shell: bash
        run: |
          set -euo pipefail

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          mkdir -p deploy/k8s/release

          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources: [../base]"
            echo "images:"

            for n in \
              api catalog city-generator orchestrator \
              retrieve-dump-spotify retrieve-lastfm \
              retrieve-musicbrainz web
            do
              printf '  - name: cityfy-%s\n    newName: %s/cityfy-%s\n    newTag: "%s"\n' \
                "$n" "$registry" "$n" "$TAG"
            done
          } > deploy/k8s/release/kustomization.yaml

          kubectl apply -k deploy/k8s/release

      - name: Rollout
        shell: bash
        run: |
          set -euo pipefail

          for r in \
            statefulset/mongo \
            statefulset/broker \
            deployment/retrieve-musicbrainz \
            deployment/catalog \
            deployment/city-generator \
            deployment/orchestrator \
            deployment/retrieve-dump-spotify \
            deployment/retrieve-lastfm \
            deployment/api \
            deployment/web
          do
            kubectl -n cityfy rollout status "$r" --timeout=10m
          done

      - name: Status
        if: always()
        run: |
          kubectl -n cityfy get pods -o wide || true
          kubectl -n cityfy get ingress,certificate || true
          kubectl -n cityfy get events --sort-by=.lastTimestamp | tail -n 40 || true

      - name: Close the tunnel
        if: always()
        run: |
          ssh -S "$RUNNER_TEMP/tunnel.sock" -O exit "$USER_NAME@$HOST" || true