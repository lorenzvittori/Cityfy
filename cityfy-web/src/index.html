<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Cityfy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Theme before the first paint (no white flash in dark mode); ThemeService takes over after.
    (function () {
      var p = 'system';
      try { p = localStorage.getItem('cityfy.theme') || 'system'; } catch (e) {}
      var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
